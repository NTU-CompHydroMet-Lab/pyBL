name: Lint

on:
  - push
  - pull_request

jobs:
  linting:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --group dev --python 3.10
      - name: Run pyright
        run: uv run pyright pybl
      - name: Run ruff
        run: uv run ruff check pybl
